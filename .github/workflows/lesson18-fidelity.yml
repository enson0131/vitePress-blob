name: Chapter 18 retry and resilience fidelity
on:
  pull_request:
    branches: [master]
    paths:
      - 'docs/.vitepress/theme/components/lesson18/**'
      - 'docs/guide/ai/chatbot-course/18-error-retry-recovery.md'
      - 'examples/chatbot-course/lesson18/**'
      - 'scripts/verify-lesson18.mjs'
      - 'scripts/lesson18-source-hashes.json'
      - '.github/workflows/lesson18-fidelity.yml'
  push:
    branches: [master]
    paths:
      - 'docs/.vitepress/theme/components/lesson18/**'
      - 'docs/guide/ai/chatbot-course/18-error-retry-recovery.md'
      - 'examples/chatbot-course/lesson18/**'
      - 'scripts/verify-lesson18.mjs'
      - 'scripts/lesson18-source-hashes.json'
      - '.github/workflows/lesson18-fidelity.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Run backend/client tests, TypeScript and React build
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p lesson18-verification
          cd examples/chatbot-course/lesson18
          npm install
          npm test 2>&1 | tee "$GITHUB_WORKSPACE/lesson18-verification/tests.log"
          npm run build 2>&1 | tee "$GITHUB_WORKSPACE/lesson18-verification/react-build.log"
      - name: Build entire VitePress site
        shell: bash
        run: |
          set -euo pipefail
          npm install --global yarn
          yarn install --ignore-engines
          yarn build 2>&1 | tee lesson18-verification/vitepress-build.log
      - name: Install browser tools
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/lesson18-tools" playwright
          "$RUNNER_TEMP/lesson18-tools/node_modules/.bin/playwright" install --with-deps chromium
      - name: Verify rendered lesson and interactions
        shell: bash
        env:
          REPORT_DIR: lesson18-verification/local
        run: |
          set -euo pipefail
          export LESSON_TOOLS="$RUNNER_TEMP/lesson18-tools"
          ./node_modules/.bin/vitepress preview docs --port 4173 > /tmp/lesson18-preview.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/vitePress-blob/ >/dev/null; then break; fi
            sleep 1
          done
          node scripts/verify-lesson18.mjs
      - name: Verify actual GitHub Pages after merge
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        shell: bash
        env:
          WAIT_FOR_PAGES: 'true'
          LESSON_URL: https://enson0131.github.io/vitePress-blob/guide/ai/chatbot-course/18-error-retry-recovery
          REPORT_DIR: lesson18-verification/live
        run: |
          set -euo pipefail
          export LESSON_TOOLS="$RUNNER_TEMP/lesson18-tools"
          node scripts/verify-lesson18.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lesson18-verification-${{ github.run_id }}
          path: lesson18-verification/
          retention-days: 14
